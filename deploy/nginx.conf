# Include in nginx's http context; replace the hostname and certificate paths.
log_format schedzo_safe '$remote_addr $request_method $uri $status';
limit_req_zone $binary_remote_addr zone=schedzo_requests:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=schedzo_connections:10m;
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/schedzo_access.log schedzo_safe;
    error_log /var/log/nginx/schedzo_error.log crit;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_conn schedzo_connections 20;
    limit_req zone=schedzo_requests burst=20 nodelay;
    limit_req_status 429;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace incoming forwarding headers for this single trusted proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
